name: iOS

# Builds the app and runs the unit target. Modelled on flyfun-weather's ios.yml.
#
# The unit target is what pins behaviour across the modernisation (see
# designs/plans/modernisation.md), including the Python parity fixture for the
# frequency model (TestFrequencyModel), so it has to run, not just compile.
#
# UI tests are intentionally NOT run: they drive a simulator and are the flaky
# half of the suite. -only-testing filters execution, not the build, so the UI
# target still compiles here.

on:
  push:
    branches: [main]
    paths: &paths
      - 'flightlogstats/**'
      - 'flightlogstatsTests/**'
      - 'flightlogstatsUITests/**'
      - 'flightlogstats.xcodeproj/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: xcodebuild test
    runs-on: macos-26
    timeout-minutes: 30

    env:
      # Pinned so a runner-image bump can't change the compiler under us. The
      # image has no Xcode 27 yet; 26.6 is its newest. Move to 27 when it lands.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Deployment target is iOS 18.6; OS=latest because the installed runtime
      # set moves with the image and an unavailable pin is a hard failure.
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17,OS=latest'

    steps:
      # The test logs (log_*.csv) and nav.db are LFS objects; without them the
      # fixtures are pointer files and the parsing tests fail.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # All SPM dependencies are public repos, so resolution needs no token.
      # -clonedSourcePackagesDirPath pulls the checkouts out of DerivedData so
      # they can be cached on their own.
      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('flightlogstats.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project flightlogstats.xcodeproj \
            -scheme FlightLogStats \
            -clonedSourcePackagesDirPath .spm

      # secrets.json is gitignored; a build phase copies secrets.sample.json
      # into place when it is missing, so no secret is needed here.
      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project flightlogstats.xcodeproj \
            -scheme FlightLogStats \
            -destination "$DESTINATION" \
            -only-testing:FlightLogStatsTests \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath unit.xcresult \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      # `-only-testing:` matching nothing is a silent vacuous pass: xcodebuild
      # exits 0 having run zero tests. Read the count back from the bundle.
      - name: Guard against a vacuous pass
        run: |
          total=$(xcrun xcresulttool get test-results summary --path unit.xcresult \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["totalTestCount"])')
          echo "Ran $total unit tests" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -eq 0 ]; then
            echo "::error::xcodebuild reported success but ran 0 tests; the -only-testing filter matched nothing."
            exit 1
          fi
          echo "Ran $total unit tests."

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-xcresult
          path: unit.xcresult
          retention-days: 7
